<body>
<div id="app">
  <canvas id="cv"></canvas>

  <div id="loading" class="screen show"><div class="spinner"></div></div>

  <div id="menu" class="screen">
    <div class="logo">
      <div class="logo-title" data-t="title"></div>
      <div class="logo-sub" data-t="subtitle"></div>
    </div>
    <div class="menu-buttons">
      <button class="btn big" id="btnPlay"><span data-t="play"></span></button>
      <button class="btn green" id="btnLevels"><span data-t="levels"></span></button>
    </div>
    <div class="menu-stars"><i class="ico" data-i="star"></i><span id="menuStars">0</span></div>
    <div class="menu-toggles">
      <button class="ibtn" id="menuSfx"></button>
      <button class="ibtn" id="menuMus"></button>
    </div>
  </div>

  <div id="levels" class="screen">
    <div class="lv-top">
      <button class="ibtn" id="lvBack"><i class="ico" data-i="back"></i></button>
      <div class="lv-head"><span data-t="levels"></span></div>
      <div class="lv-stars"><i class="ico" data-i="star"></i><span id="lvStars">0</span></div>
    </div>
    <div class="lv-pager">
      <button class="ibtn" id="chPrev"><i class="ico" data-i="left"></i></button>
      <div class="lv-chapter"><div id="chNum"></div><div id="chName"></div></div>
      <button class="ibtn" id="chNext"><i class="ico" data-i="right"></i></button>
    </div>
    <div class="lv-grid" id="lvGrid"></div>
  </div>

  <div id="hud" class="screen">
    <div class="hud-bar">
      <button class="ibtn" id="btnPause"><i class="ico" data-i="pause"></i></button>
      <div class="hud-title"><div id="hudLevel"></div><div id="hudFlies" class="hud-flies"></div></div>
      <button class="ibtn" id="btnHint"><i class="ico" data-i="bulb"></i></button>
      <button class="ibtn" id="btnRestart"><i class="ico" data-i="restart"></i></button>
    </div>
    <div id="tip" class="tip"></div>
    <button class="rbtn" id="rotL"><i class="ico" data-i="ccw"></i></button>
    <button class="rbtn" id="rotR"><i class="ico" data-i="cw"></i></button>
    <button class="btn done" id="btnDone"><span data-t="done"></span> <span id="doneStars"></span></button>
  </div>

  <div id="dlg" class="overlay">
    <div class="dlg">
      <div class="dlg-title" id="dlgTitle"></div>
      <div class="dlg-stars" id="dlgStars"></div>
      <div class="dlg-text" id="dlgText"></div>
      <div class="dlg-buttons" id="dlgButtons"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
</div>

function startLevel(i) {
current = i;
won = false;
hintUsed = false;
closeDialog();
const L = LEVELS[i];
const [c, k] = chapterOf(i);
$('hudLevel').textContent = `${t('level')} ${c + 1}-${k + 1}`;
const tip = $('tip');
tip.textContent = L.tip ? t(L.tip) : '';
tip.classList.toggle('show', !!L.tip);
show('hud');
game.tipH = L.tip ? tip.offsetHeight + 6 : 0;
game.load(L);
updateRotateButtons(null);
}
function placeControls(L) {
const set = (el, r) => {
el.style.left = r.x + 'px';
el.style.top = r.y + 'px';
el.style.width = r.w + 'px';
el.style.height = r.h + 'px';
el.style.fontSize = Math.round(r.w * 0.5) + 'px';
};
set($('rotL'), L.rotL);
set($('rotR'), L.rotR);
const done = $('btnDone');
done.style.left = (L.tray.x + L.tray.w / 2) + 'px';
done.style.top = (L.tray.y + L.tray.h / 2) + 'px';
done.style.transform = 'translate(-50%, -50%)';
$('tip').style.top = ($('app').clientHeight < 520 ? 48 : 62) + 'px';
}
function updateRotateButtons(sel) {
const on = !!sel;
$('rotL').classList.toggle('dim', !on);
$('rotR').classList.toggle('dim', !on);
}
function showFlies(got, total) {
const el = $('hudFlies');
let s = '';
for (let q = 0; q < total; q++) s += icon('fly', q < got ? 'on' : '');
el.innerHTML = s;
}
function showDone(visible, got) {
const b = $('btnDone');
b.classList.toggle('show', visible && !won);
if (visible) {
const total = game.level.fly.length;
let s = '';
for (let q = 0; q < 3; q++) s += icon('star', q < 1 + got || q >= 1 + total ? '' : 'off');
$('doneStars').innerHTML = s;
}
}
function levelWon(stars) {
won = true;
syncGameplay();
const L = LEVELS[current];
const p = progress();
p.lv[L.id] = Math.max(p.lv[L.id] || 0, stars);
delete p.sk[L.id];
saveProgress(true);
levelFinished();
$('btnDone').classList.remove('show');
const last = current === LEVELS.length - 1;
const [c, k] = chapterOf(current);
const chapterEnd = k === CHAPTERS[c].levels.length - 1;
openDialog({
title: chapterEnd ? t('chapterDone') : t('complete'),
stars,
text: last ? t('allDone') : stars < 3 ? t('flyHint') : '',
buttons: [
{ label: t('replay'), cls: 'gray small', icon: 'restart', fn: () => startLevel(current) },
{ label: last ? t('menu') : t('next'), cls: 'small', icon: last ? 'home' : 'play', fn: () => goNext() },
],
});
}
async function goNext() {
closeDialog();
if (current >= LEVELS.length - 1) { openMenu(); return; }
await betweenLevels(current);
startLevel(current + 1);
}
function openDialog({ title, stars, text, buttons }) {
dialogOpen = true;
syncGameplay();
$('dlgTitle').textContent = title;
const st = $('dlgStars');
st.innerHTML = '';
if (stars !== undefined) {
for (let q = 0; q < 3; q++) st.innerHTML += icon('star');
const items = st.querySelectorAll('.ico');
for (let q = 0; q < stars; q++) {
setTimeout(() => { items[q].classList.add('on'); audio.star(q); }, 300 + q * 320);
}
}
$('dlgText').textContent = text || '';
const bb = $('dlgButtons');
bb.innerHTML = '';
for (const b of buttons) {
const el = document.createElement('button');
el.className = 'btn ' + (b.cls || '');
el.innerHTML = (b.icon ? icon(b.icon) : '') + `<span>${b.label}</span>`;
el.addEventListener('click', () => { audio.unlockAudio(); audio.ui(); b.fn(); });
bb.appendChild(el);
}
$('dlg').classList.add('show');
}
function closeDialog() {
dialogOpen = false;
$('dlg').classList.remove('show');
syncGameplay();
}
function openPause() {
const s = progress().set;
openDialog({
title: t('pause'),
buttons: [
{ label: t('resume'), cls: 'green', icon: 'play', fn: closeDialog },
{ label: t('restart'), cls: 'gray small', icon: 'restart', fn: () => startLevel(current) },
{ label: t('levels'), cls: 'gray small', icon: 'home', fn: () => openLevels(chapterOf(current)[0]) },
{ label: t('skipTitle'), cls: 'gray small', icon: 'video', fn: askSkip },
{ label: `${t('sound')}: ${s.sfx ? t('on') : t('off')}`, cls: 'gray small', icon: s.sfx ? 'sound' : 'soundOff', fn: () => { toggleSetting('sfx'); openPause(); } },
{ label: `${t('music')}: ${s.mus ? t('on') : t('off')}`, cls: 'gray small', icon: s.mus ? 'music' : 'musicOff', fn: () => { toggleSetting('mus'); openPause(); } },
],
});
}
function askSkip() {
openDialog({
title: t('skipTitle'),
text: t('skipText'),
buttons: [
{ label: t('cancel'), cls: 'gray small', fn: openPause },
{ label: t('watch'), cls: 'small', icon: 'video', fn: async () => {
closeDialog();
const ok = await rewarded();
if (!ok) { toast(t('adFail')); return; }
const L = LEVELS[current];
const p = progress();
if (!(L.id in p.lv)) p.sk[L.id] = 1;
saveProgress(true);
if (current < LEVELS.length - 1) startLevel(current + 1);
else openMenu();
} },
],
});
}
function askHint() {
if (won) return;
const h = findHint();
if (!h) { toast(t('noHint')); return; }
if (hintUsed) { game.setHint(h); return; }
openDialog({
title: t('hintTitle'),
text: t('hintText'),
buttons: [
{ label: t('cancel'), cls: 'gray small', fn: closeDialog },
{ label: t('watch'), cls: 'small', icon: 'video', fn: async () => {
closeDialog();
const ok = await rewarded();
if (!ok) { toast(t('adFail')); return; }
hintUsed = true;
game.setHint(findHint());
} },
],
});
}
function findHint() {
const L = game.level;
if (!L || !L.sol) return null;
const fixed = game.pieces.filter((p) => p.fixed);
for (let i = 0; i < fixed.length; i++) {
const p = fixed[i];
const sym = PIECE[p.t].sym;
if (p.rot && ((p.r - L.sol.base[i]) % sym + sym) % sym !== 0) {
return { t: p.t, x: p.x, y: p.y, r: L.sol.base[i], c: p.c };
}
}
for (const s of L.sol.placed) {
const sym = PIECE[s.t].sym;
const ok = game.pieces.some((q) => !q.fixed && q.t === s.t && (q.c || 0) === (s.c || 0) &&
q.x === s.x && q.y === s.y && ((q.r - s.r) % sym + sym) % sym === 0);
if (!ok) return s;
}
return null;
}
function bindUi() {
const tapSafe = (id, fn) => $(id).addEventListener('click', () => { audio.unlockAudio(); fn(); });
tapSafe('btnPlay', () => { audio.ui(); startLevel(nextUnfinished()); });
tapSafe('btnLevels', () => { audio.ui(); openLevels(); });
tapSafe('lvBack', () => { audio.ui(); openMenu(); });
tapSafe('chPrev', () => { if (pagerChapter > 0) { pagerChapter--; audio.ui(); renderLevels(); } });
tapSafe('chNext', () => { if (pagerChapter < CHAPTERS.length - 1) { pagerChapter++; audio.ui(); renderLevels(); } });
tapSafe('menuSfx', () => toggleSetting('sfx'));
tapSafe('menuMus', () => toggleSetting('mus'));
tapSafe('btnPause', () => { audio.ui(); openPause(); });
tapSafe('btnRestart', () => { audio.ui(); startLevel(current); });
tapSafe('btnHint', () => { audio.ui(); askHint(); });
tapSafe('btnDone', () => game.finish());
for (const [id, dir] of [['rotL', -1], ['rotR', 1]]) {
const el = $(id);
let timer = 0;
const stop = () => { clearTimeout(timer); timer = 0; };
el.addEventListener('pointerdown', (e) => {
e.preventDefault();
audio.unlockAudio();
if (!game.rotate(dir)) return;
const rep = (delay) => { timer = setTimeout(() => { if (game.rotate(dir)) rep(110); }, delay); };
rep(380);
});
el.addEventListener('pointerup', stop);
el.addEventListener('pointerleave', stop);
el.addEventListener('pointercancel', stop);
}
window.addEventListener('keydown', (e) => {
if (screen !== 'game' || dialogOpen) return;
const k = e.key.toLowerCase();
if (k === 'q' || k === 'arrowleft' || k === 'й') game.rotate(-1);
else if (k === 'e' || k === 'arrowright' || k === 'у') game.rotate(1);
else if (k === 'r' || k === 'к') startLevel(current);
else if (k === 'escape') openPause();
else return;
e.preventDefault();
});
for (const ev of ['pointerdown', 'touchend', 'click', 'keydown']) {
document.addEventListener(ev, audio.unlockAudio, { passive: true });
}
document.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('selectstart', (e) => e.preventDefault());
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault());
document.addEventListener('touchmove', (e) => { if (e.touches.length > 1 || e.target === cv) e.preventDefault(); }, { passive: false });
document.addEventListener('wheel', (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
document.addEventListener('visibilitychange', () => {
if (document.hidden) pushPause('hidden'); else popPause('hidden');
});
window.addEventListener('pagehide', () => pushPause('hidden'));
window.addEventListener('pageshow', () => { if (!document.hidden) popPause('hidden'); });
window.addEventListener('blur', () => pushPause('blur'));
window.addEventListener('focus', () => popPause('blur'));
onPause((p) => audio.setPaused(p));
}
let last = performance.now();
function frame(now) {
const dt = Math.min(0.05, (now - last) / 1000);
last = now;
if (!isPaused()) game.update(dt);
game.render();
requestAnimationFrame(frame);
}
function resize() {
const app = $('app');
const w = app.clientWidth || window.innerWidth, h = app.clientHeight || window.innerHeight;
const tip = $('tip');
if (tip.classList.contains('show')) game.tipH = tip.offsetHeight + 6;
const dpr = Math.min(2, window.devicePixelRatio || 1);
game.resize(w, h, dpr);
}
async function boot() {
fillIcons(document);
bindUi();
await initSdk();
setLang(sdkLang());
applyTexts();
await loadProgress();
applySettings();
resize();
window.addEventListener('resize', resize);
requestAnimationFrame(frame);
const dev = location.hostname === 'localhost' ? new URLSearchParams(location.search) : null;
if (dev && dev.has('level')) {
startLevel(Math.min(LEVELS.length - 1, Number(dev.get('level'))));
if (dev.has('solve')) game.applySolution(Number(dev.get('solve')) || Infinity, dev.has('nowin'));
if (dev.has('nohud')) { $('tip').classList.remove('show'); }
if (dev.has('pause')) openPause();
if (dev.has('done')) showDone(true, 0);
} else if (dev && dev.has('screen')) {
if (dev.get('screen') === 'levels') openLevels(Number(dev.get('ch') || 0)); else openMenu();
} else if (Object.keys(progress().lv).length === 0 && Object.keys(progress().sk).length === 0) startLevel(0);
else openMenu();
gameReady();
}
if (location.hostname === 'localhost') Object.assign(window, { __game: game, __paused: isPaused });
boot();
return {  };
})();
})();</script>
