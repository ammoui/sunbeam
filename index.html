    <div class="topbar">
      <div class="wallet glass">
        <span class="chip star"><i class="ico" data-i="star"></i><b id="menuStars">0</b></span>
        <span class="chip gem"><i class="ico" data-i="gem"></i><b id="menuGems">0</b></span>
      </div>

      <div class="logo-sub" data-t="subtitle"></div>
    </div>
    <div class="menu-card glass">
      <button class="btn big" id="btnPlay"><i class="ico" data-i="play"></i><span class="lbl"><span id="playLabel" data-t="play"></span><small id="playSub"></small></span></button>
      <button class="btn daily" id="btnDaily"><i class="ico" data-i="sun"></i><span id="dailyLabel" data-t="daily"></span><span class="streak" id="dailyStreak"></span></button>
      <div class="menu-tiles">
        <button class="tile" id="btnLevels"><i class="ico" data-i="grid"></i><span data-t="levels"></span><small id="levelsSub"></small></button>
        <button class="tile" id="btnThemes"><i class="ico" data-i="palette"></i><span data-t="themes"></span><small id="themesSub"></small><b class="dot" id="themesDot" hidden></b></button>
      </div>
    </div>
    <div class="dock glass">
      <button class="ibtn" id="menuTop" hidden><i class="ico" data-i="trophy"></i></button>
      <button class="ibtn" id="menuShop" hidden><i class="ico" data-i="cart"></i></button>
      <button class="ibtn" id="menuShortcut" hidden><i class="ico" data-i="pin"></i></button>
      <button class="ibtn" id="menuSettings"><i class="ico" data-i="gear"></i></button>
    </div>
  </div>

  <div id="levels" class="screen">
    <div class="topbar">
      <button class="ibtn glass" id="lvBack"><i class="ico" data-i="back"></i></button>
      <div class="tb-title" data-t="levels"></div>
      <div class="wallet glass"><span class="chip star"><i class="ico" data-i="star"></i><b id="lvStars">0</b></span></div>
    </div>
    <div class="lv-card glass" id="lvCard">
      <div class="lv-head">
        <button class="ibtn flat" id="chPrev"><i class="ico" data-i="left"></i></button>
        <div class="lv-chapter"><div id="chNum"></div><div id="chName"></div></div>
        <button class="ibtn flat" id="chNext"><i class="ico" data-i="right"></i></button>
      </div>
      <div class="lv-progress"><div class="bar"><i id="chBar"></i></div><span id="chStars"></span></div>
      <div class="lv-body">
        <div class="lv-grid" id="lvGrid"></div>
        <div class="lv-gate" id="lvGate" hidden>
          <i class="ico gate-ico" data-i="lock"></i>
          <div class="gate-need" id="gateNeed"></div>
          <div class="gate-text" id="gateText"></div>
          <div class="gate-buttons" id="gateButtons"></div>
        </div>
      </div>
    </div>
    <div class="lv-strip glass" id="lvStrip"></div>
  </div>

  <div id="themes" class="screen">
    <div class="topbar">
      <button class="ibtn glass" id="thBack"><i class="ico" data-i="back"></i></button>
      <div class="tb-title" data-t="themes"></div>
      <div class="wallet glass"><span class="chip gem"><i class="ico" data-i="gem"></i><b id="thGems">0</b></span></div>
    </div>
    <div class="th-scroll"><div class="th-grid" id="thGrid"></div></div>
    <div class="th-bar glass">
      <div class="th-info"><b id="thName"></b><small id="thNote"></small></div>
      <button class="btn" id="thAction"></button>
    </div>
  </div>

  <div id="hud" class="screen">
    <div class="hud-bar">
      <button class="ibtn glass" id="btnPause"><i class="ico" data-i="pause"></i></button>
      <div class="hud-title glass"><div id="hudLevel"></div><div id="hudFlies" class="hud-flies"></div></div>
      <button class="ibtn glass" id="btnHint"><i class="ico" data-i="bulb"></i></button>
      <button class="ibtn glass" id="btnRestart"><i class="ico" data-i="restart"></i></button>
    </div>
    <div id="tip" class="tip glass"></div>
    <button class="rbtn" id="rotL"><i class="ico" data-i="ccw"></i></button>
    <button class="rbtn" id="rotR"><i class="ico" data-i="cw"></i></button>
    <button class="btn done" id="btnDone"><span data-t="done"></span> <span id="doneStars"></span></button>
  </div>

  <div id="dlg" class="overlay">
    <div class="dlg glass">
      <div class="dlg-title" id="dlgTitle"></div>
      <div class="dlg-stars" id="dlgStars"></div>
      <div class="dlg-reward" id="dlgReward"></div>
      <div class="dlg-text" id="dlgText"></div>
      <div class="dlg-sliders" id="dlgSliders"></div>
      <div class="dlg-buttons" id="dlgButtons"></div>
      <div class="dlg-tools" id="dlgTools"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
</div>
